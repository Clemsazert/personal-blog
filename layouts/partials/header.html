{{ if not .IsHome }}
<header class="site-header">
  <a class="header-home" href="{{ "/" | relLangURL }}">{{ .Site.Title }}</a>
  <nav class="header-nav">
    <a href="{{ "/articles/" | relLangURL }}"{{ if eq .Section "articles" }} class="active"{{ end }}>Articles</a>
    <a href="{{ "/til/" | relLangURL }}"{{ if eq .Section "til" }} class="active"{{ end }}>TIL</a>
    {{ if .IsTranslated }}
      {{ range .Translations }}
        <a class="lang-switch" href="{{ .RelPermalink }}">{{ .Language.LanguageName }}</a>
      {{ end }}
    {{ end }}
  </nav>
</header>
{{ end }}
